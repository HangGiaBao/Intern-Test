<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Test Thực Tập Frontend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Danh Sách Sản Phẩm</h1>
            
            <div class="filter-bar">
                <input type="text" id="search-box" placeholder="Nhập tên sản phẩm để tìm..." onkeyup="timKiemSanPham()">
                
                <select id="sort-box" onchange="sapXepSanPham()">
                    <option value="default">Sắp xếp giá</option>
                    <option value="tang">Giá tăng dần</option>
                    <option value="giam">Giá giảm dần</option>
                </select>
            </div>
        </header>

        <p id="loading-text">Đang tải dữ liệu, vui lòng đợi...</p>

        <div id="product-list" class="grid-list"></div>
    </div>

    <div id="modal-container" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="dongModal()">&times;</span>
            
            <div class="modal-body">
                <img id="m-image" src="" alt="Anh san pham">
                <div class="m-info">
                    <h2 id="m-title">Tên sản phẩm</h2>
                    <p id="m-price" class="price">Giá: $0</p>
                    <p><strong>Mô tả:</strong></p>
                    <p id="m-desc">Nội dung mô tả...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
